name: ClearShot
options:
  bundleIdPrefix: app.clearshot
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
      ARCHS: "arm64 x86_64"
targets:
  ClearShot:
    type: application
    platform: macOS
    sources:
      - path: ClearShot
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.clearshot.ClearShot
        PRODUCT_NAME: ClearShot
        INFOPLIST_FILE: ClearShot/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "4"
        # Signing is done by scripts/codesign.sh so the identity stays stable across rebuilds.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Code sign
        script: '"$SRCROOT/scripts/codesign.sh"'
        basedOnDependencyAnalysis: false
